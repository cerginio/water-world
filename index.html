<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Edge of the Elements</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; }
    #perf {
      position: fixed; left: 8px; top: 8px; width: max-content; min-width: 250px; box-sizing: border-box; padding: 10px 12px;
      font: 12px/1.35 system-ui, sans-serif; color: #e8f4ff; background: rgba(6, 10, 14, 0.6); border-radius: 8px;
    }
    #pGpu { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #pSpec { font-size: 11px; opacity: 0.6; }
    .pRow { display: flex; align-items: baseline; gap: 4px; margin-top: 2px; }
    #pFps { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .pRow > i { font-style: normal; font-weight: 700; color: #2cc9ff; }
    .pRow > span { margin-left: auto; text-align: right; font-size: 11px; font-variant-numeric: tabular-nums; }
    #pMode { font-style: normal; font-size: 10px; font-weight: 700; letter-spacing: 2px; color: #2cc9ff; }
    #perf canvas { width: 100%; height: 24px; margin: 2px 0 8px; }
    #perf button {
      display: block; width: 100%; padding: 6px; border: 0; border-radius: 5px; cursor: pointer;
      font: 600 12px system-ui, sans-serif; color: #071018; background: #2cc9ff;
    }
    #pUncap.on { color: #ebebeb; background: #424242; }
    #pSky { margin-top: 4px; }
    /* double tap copies the panel text (src/ui/perfCopy.js); no double-tap zoom here */
    #perf { touch-action: manipulation; }
    #perf[data-copied="ok"] { outline: 2px solid #2cc9ff; }
    #perf[data-copied="fail"] { outline: 2px solid #ff5a4a; }
    #hud { margin-top: 8px; font: 10px/1.35 ui-monospace, Consolas, monospace; white-space: pre; opacity: 0.75; }
    #hud:empty { display: none; }
    /* phones (class set by main.js): smaller, and down at the bottom, clear of the settings panel */
    .mobile #perf { top: auto; bottom: 8px; min-width: 190px; padding: 8px 10px; font-size: 10px; }
    .mobile #pFps { font-size: 26px; }
    .mobile #hud { font-size: 8px; }
    #perf[hidden], #techStrip[hidden] { display: none; }
    /* three-finger tap on touch screens: the F2 / F3 keys as buttons (SCENE-UI-SPEC §3.2) */
    /* the strip and a bottom #perf stand above the station rail (SCENE-UI-SPEC §3.2, §4.6) */
    :root { --rail-top: calc(12px + 64px + env(safe-area-inset-bottom)); }
    #techStrip {
      position: fixed; left: 50%; bottom: calc(var(--rail-top) + 8px); transform: translateX(-50%);
      display: flex; gap: 8px; padding: 6px; border-radius: 10px; background: rgba(6, 10, 14, 0.6); z-index: 10;
    }
    #techStrip button {
      min-width: 44px; min-height: 44px; padding: 0 14px; border: 0; border-radius: 6px; cursor: pointer;
      font: 600 13px system-ui, sans-serif; color: #e8f4ff; background: #424242;
    }
    #techStrip button[aria-pressed="true"] { color: #071018; background: #2cc9ff; }
    .mobile #perf { bottom: calc(var(--rail-top) + 8px); }
    .tech-strip.mobile #perf { bottom: calc(var(--rail-top) + 72px); }

    /* station rail (SCENE-UI-SPEC §4.1): four nodes, ● on the station, ◎ the last one,
       a bead runs between them during a flight */
    #stationRail {
      position: fixed; left: 50%; bottom: calc(12px + env(safe-area-inset-bottom)); transform: translateX(-50%);
      display: grid; grid-template-columns: repeat(4, 76px); height: 64px; z-index: 9;
      font: 500 12px/1.2 system-ui, sans-serif; color: #e8f4ff; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.7);
    }
    /* through the dot centres: .station padding-top 10 + half the 14 px dot = 17 px = top 16 + half of 2 px */
    #stationRail .track {
      position: absolute; left: 38px; right: 38px; top: 16px; height: 2px; background: rgba(232, 244, 255, 0.45);
      pointer-events: none;
    }
    #stationRail .bead {
      position: absolute; top: -3px; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: #e8f4ff;
    }
    #stationRail .bead[hidden] { display: none; }
    #stationRail .station {
      position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px;
      min-width: 44px; min-height: 44px; padding: 10px 0 0; border: 0; background: none; color: inherit; font: inherit;
      text-shadow: inherit; cursor: pointer;
    }
    #stationRail .dot {
      width: 14px; height: 14px; box-sizing: border-box; border-radius: 50%; border: 2px solid #e8f4ff;
      background: rgba(6, 10, 14, 0.55);
    }
    #stationRail .station.on .dot { background: #e8f4ff; }
    #stationRail .station.last .dot { box-shadow: inset 0 0 0 2px rgba(6, 10, 14, 0.55), inset 0 0 0 5px #e8f4ff; }
    #stationRail .station[aria-disabled="true"] { opacity: 0.4; cursor: default; }
    #stationRail .station:focus-visible { outline: 2px solid #2cc9ff; outline-offset: 2px; border-radius: 6px; }
    /* reduced motion: fade out, place, fade in (SCENE-UI-SPEC §4.4) */
    /* phones (SCENE-UI-SPEC §4.6): the rail spans the width with 16 px margins over the
       safe area, leaving a slot on the right for the round weather button (MOOD-WEATHER §4.1) */
    .mobile { --rail-top: calc(16px + 64px + env(safe-area-inset-bottom)); --weather-slot: calc(56px + 8px); }
    .mobile #stationRail {
      left: calc(16px + env(safe-area-inset-left)); right: calc(16px + var(--weather-slot) + env(safe-area-inset-right));
      bottom: calc(16px + env(safe-area-inset-bottom)); transform: none; grid-template-columns: repeat(4, 1fr);
    }
    .mobile #stationRail .track { left: 12.5%; right: 12.5%; }
    /* a phone on its side has no room for #perf over the strip: it goes up, as on desktop */
    @media (max-height: 500px) {
      .mobile #perf, .tech-strip.mobile #perf { top: calc(8px + env(safe-area-inset-top)); bottom: auto; }
    }
    /* mood weather (MOOD-WEATHER-SPEC §4.1, §4.2; src/environment/ui/moodPad.js): a round 56 px
       button right of the rail; open — the sun's arc over the weather window (240 px; on phones a
       bottom sheet above the rail, the window up to 320 px). No numbers, no sliders (§6 p.9). */
    #moodPad { --pad: 240px; font: 500 12px/1.2 system-ui, sans-serif; color: #e8f4ff; }
    #moodPad .mood-button {
      position: fixed; z-index: 9; width: 56px; height: 56px; padding: 4px; border: 0; border-radius: 50%;
      left: min(calc(50% + 152px + 12px), calc(100% - 56px - 8px)); bottom: calc(12px + 4px + env(safe-area-inset-bottom));
      background: rgba(6, 10, 14, 0.55); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.5); cursor: pointer;
    }
    #moodPad .mood-thumb {
      display: block; width: 100%; height: 100%; border-radius: 50%;
      background: linear-gradient(#7fb6e6 0 58%, #1d6f8c 58% 100%);
    }
    #moodPad.open .mood-button { box-shadow: 0 0 0 2px #e8f4ff; }
    #moodPad .mood-button:focus-visible { outline: 2px solid #2cc9ff; outline-offset: 3px; }
    #moodPad .mood-panel {
      position: fixed; z-index: 11; right: max(8px, calc(50% - 220px)); bottom: calc(var(--rail-top) + 8px);
      display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 12px 16px 16px;
      border-radius: 14px; background: rgba(6, 10, 14, 0.62); backdrop-filter: blur(6px);
    }
    #moodPad .mood-panel[hidden] { display: none; }
    #moodPad .mood-arc { display: block; width: var(--pad); height: auto; touch-action: none; cursor: pointer; }
    #moodPad .mood-sun { fill: #fff1c2; stroke: #ffffff; stroke-width: 2; filter: drop-shadow(0 0 4px #ffd27a); }
    /* the corners are anchors (A1, A3, A7, A9) and the pebble sits on them: the rounded look is a
       ::before, the hit area is the whole square plus the pebble's radius (::after) */
    #moodPad .mood-window { position: relative; width: var(--pad); height: var(--pad); touch-action: none; cursor: pointer; }
    #moodPad .mood-window::before {
      content: ''; position: absolute; inset: 0; border-radius: 10px;
      background: linear-gradient(to top, rgba(29, 111, 140, 0.55), rgba(29, 111, 140, 0) 55%),
        linear-gradient(to right, #8a929b, #a7bccb 50%, #79b8ea);
    }
    #moodPad .mood-window::after { content: ''; position: absolute; inset: -11px; }
    #moodPad .mood-pebble {
      position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%;
      background: #f4f1ea; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.55); pointer-events: none;
    }
    /* custom (§4.5): the Controls changed the world by hand; the next touch hands it back */
    #moodPad .mood-panel.custom .mood-pebble, #moodPad .mood-panel.custom .mood-sun { opacity: 0.45; }
    .mobile #moodPad .mood-button { left: auto; right: calc(16px + env(safe-area-inset-right)); bottom: calc(16px + 4px + env(safe-area-inset-bottom)); }
    .mobile #moodPad {
      --pad: min(320px, calc(100vw - 48px - env(safe-area-inset-left) - env(safe-area-inset-right)),
        calc((100dvh - var(--rail-top) - 56px - env(safe-area-inset-top)) / 1.3));
    }
    .mobile #moodPad .mood-panel {
      left: calc(8px + env(safe-area-inset-left)); right: calc(8px + env(safe-area-inset-right));
      bottom: calc(var(--rail-top) + 8px); padding: 10px 16px 12px;
    }
    #stationFade {
      position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 8;
      transition: opacity 250ms linear;
    }
    #stationFade.dark { opacity: 1; }
  </style>
</head>
<body>
  <div id="perf" hidden>
    <div id="pGpu"></div>
    <div id="pSpec"></div>
    <div class="pRow"><b id="pFps">–</b><i>FPS</i><span><em id="pMode">VSYNC</em><br><span id="pMs"></span></span></div>
    <canvas id="pGraph" width="456" height="48"></canvas>
    <button id="pUncap" type="button" title="Render frames back-to-back instead of once per display refresh, so the counter shows what this machine can do. The screen still updates at its own rate.">Uncap FPS</button>
    <button id="pSky" type="button" title="Time one sky change step by step: atmosphere LUTs, cube faces, PMREM, sun shadow, ocean spectrum (SCENE-ENVIRONMENT E0). The scene pauses for a few seconds.">Measure sky</button>
    <div id="hud"></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
